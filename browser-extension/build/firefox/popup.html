<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Password Manager</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f7;
      --panel: #ffffff;
      --text: #111111;
      --muted: #555555;
      --border: #cfcfcf;
      --border-strong: #111111;
      --subtle: #efefef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 350px;
      min-height: 400px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    .container {
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-strong);
    }

    .header-icon {
      width: 36px;
      height: 36px;
      margin-right: 10px;
      background: #111111;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .header-title p {
      font-size: 12px;
      color: var(--muted);
    }

    .status {
      margin-bottom: 16px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--panel);
      font-size: 13px;
    }

    .status.connected {
      color: var(--text);
    }

    .status.disconnected {
      color: var(--text);
    }

    .status.warning {
      color: var(--text);
    }

    .status-icon {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      background: #111111;
    }

    .status.connected .status-icon {
      background: #111111;
    }

    .status.disconnected .status-icon {
      background: #7a7a7a;
    }

    .status.warning .status-icon {
      background: #7a7a7a;
    }

    .pairing-section, .actions-section {
      margin-bottom: 16px;
    }

    .section-title {
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--text);
    }

    .input-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: #ffffff;
      color: var(--text);
      font-size: 14px;
      font-family: monospace;
      letter-spacing: 2px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--border-strong);
    }

    button {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: none;
    }

    button.primary {
      background: #111111;
      color: white;
    }

    button.primary:hover {
      background: #000000;
    }

    button.secondary {
      background: #ffffff;
      color: var(--text);
    }

    button.secondary:hover {
      background: var(--subtle);
    }

    button.danger {
      background: #ffffff;
      color: var(--text);
    }

    button.danger:hover {
      background: var(--subtle);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .info {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.4;
    }

    .token-info {
      background: var(--panel);
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 2px;
      margin-bottom: 10px;
    }

    .token-info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .token-info-row:last-child {
      margin-bottom: 0;
    }

    .token-info-label {
      color: var(--muted);
    }

    .token-info-value {
      color: var(--text);
      font-weight: 500;
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 12px;
    }

    .footer-links a {
      color: var(--text);
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #d0d0d0;
      border-top: 2px solid #111111;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 10V8C6 4.69 8.69 2 12 2C15.31 2 18 4.69 18 8V10" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <rect x="5" y="10" width="14" height="11" rx="2" stroke="white" stroke-width="2"/>
          <path d="M12 14V17" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="header-title">
        <h1>Secure Password Manager</h1>
        <p>Browser Extension</p>
      </div>
    </div>

    <div id="status" class="status disconnected">
      <span class="status-icon"></span>
      <span id="status-text">Checking connection...</span>
    </div>

    <!-- Pairing Section (shown when not paired) -->
    <div id="pairing-section" class="pairing-section hidden">
      <div class="section-title">Pair with Desktop App</div>
      <div class="input-group">
        <label for="pairing-code">Enter 6-digit pairing code</label>
        <input type="text" id="pairing-code" placeholder="000000" maxlength="6" pattern="[0-9]{6}">
      </div>
      <button id="pair-btn" class="primary">
        <span id="pair-btn-text">Pair Extension</span>
      </button>
      <p class="info">
        Open the desktop app and navigate to Settings → Browser Bridge to generate a pairing code.
      </p>
    </div>

    <!-- Connected Section (shown when paired) -->
    <div id="connected-section" class="hidden">
      <div class="token-info">
        <div class="token-info-row">
          <span class="token-info-label">Status:</span>
          <span class="token-info-value" id="connection-status">Connected</span>
        </div>
        <div class="token-info-row">
          <span class="token-info-label">Fingerprint:</span>
          <span class="token-info-value" id="fingerprint-value">-</span>
        </div>
        <div class="token-info-row">
          <span class="token-info-label">Expires:</span>
          <span class="token-info-value" id="expires-value">-</span>
        </div>
      </div>

      <div class="actions-section">
        <div class="section-title">Actions</div>
        <button id="test-autofill-btn" class="secondary" style="margin-bottom: 8px;">
          Test Autofill on Current Page
        </button>
        <button id="unpair-btn" class="danger">
          Unpair Extension
        </button>
      </div>
    </div>

    <div class="footer">
      <div class="footer-links">
        <a href="#" id="help-link">Help</a>
        <a href="#" id="settings-link">Settings</a>
        <a href="#" id="about-link">About</a>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
